<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME EDUKASI ANAK (GEA) - KIBSA</title>
    <meta name="description" content="Game edukasi interaktif untuk anak SD - Progressive Learning">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #6C5CE7;
            --accent: #FF6B6B;
            --yellow: #FECA57;
            --green: #1DD1A1;
            --blue: #48DBFB;
            --orange: #FF9F43;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow: 0 20px 60px rgba(0,0,0,0.3);
            --border-radius: 25px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Comic Sans MS', 'Arial', sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .floating-shape { position: absolute; border-radius: 50%; animation: float 15s infinite; opacity: 0.3; }
        @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(180deg); } }

        /* Login card */
        .login-card {
            background: rgba(255,255,255,0.95);
            border-radius: var(--border-radius);
            padding: 40px;
            width: 500px;
            max-width: 90vw;
            box-shadow: 0 0 20px rgba(108,92,231,0.4), 0 0 40px rgba(72,219,251,0.3), 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            animation: bounceIn 0.8s ease;
            border: 3px solid transparent;
            background-clip: padding-box;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: calc(var(--border-radius) + 3px);
            background: linear-gradient(135deg, #ff6b6b, #feca57, #1dd1a1, #48dbfb, #ff9ff3, #ff6b6b);
            background-size: 300% 300%;
            z-index: -1;
            animation: gradientShift 6s ease infinite;
        }
        @keyframes gradientShift { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }
        @keyframes bounceIn { 0% { transform: scale(0); opacity:0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity:1; } }
        .logo-container { display: flex; justify-content: center; margin-bottom: 20px; }
        .logo { max-width: 120px; height: auto; }
        .game-title { font-size: 40px; color: var(--primary); margin-bottom: 10px; animation: rainbow 3s infinite; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        @keyframes rainbow { 0% { color:#FF6B6B; } 25% { color:#FECA57; } 50% { color:#1DD1A1; } 75% { color:#48DBFB; } 100% { color:#FF6B6B; } }
        .game-subtitle { font-size: 18px; color: #666; margin-bottom: 25px; }
        .login-input {
            width: 100%;
            padding: 15px 20px;
            border: 3px solid var(--primary);
            border-radius: 50px;
            font-size: 18px;
            margin: 15px 0;
            outline: none;
            transition: all 0.3s;
            background: white;
        }
        .login-input:focus { border-color: var(--accent); transform: scale(1.02); box-shadow: 0 0 20px rgba(108,92,231,0.3); }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--gradient);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(108,92,231,0.4);
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(108,92,231,0.6); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-primary::after { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%,-50%); transition: width 0.6s, height 0.6s; }
        .btn-primary:hover::after { width: 300px; height: 300px; }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            color: #ffffff;
            font-size: 14px;
            z-index: 5;
            backdrop-filter: blur(5px);
        }
        .footer-left { text-align: left; }
        .footer-right { text-align: right; }

        #mainContainer { display: none; width: 100%; height: 100vh; flex-direction: column; background: #f0f0f0; }
        .header {
            background: var(--gradient);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 5;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .header-logo { height: 45px; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .player-badge { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; }
        .player-avatar { width: 40px; height: 40px; background: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 20px; }

        /* Room menu - 2 column desktop */
        .room-menu { flex: 1; padding: 20px; overflow-y: auto; display: flex; gap: 20px; align-items: flex-start; }
        .room-menu-left { flex: 2; display: flex; flex-direction: column; gap: 20px; }
        .room-menu-title { font-size: 28px; color: var(--primary); text-align: center; }
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .room-card {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .room-card:hover:not(.locked) { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-color: var(--primary); }
        .room-card.locked { opacity: 0.6; cursor: not-allowed; }
        .room-card.locked .room-icon { filter: grayscale(100%); }
        .room-icon { font-size: 48px; margin-bottom: 10px; }
        .room-name { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .room-info { font-size: 13px; color: #666; margin-bottom: 10px; }
        .room-lock-icon { position: absolute; top: 10px; right: 10px; font-size: 24px; }

        /* Sidebar ulasan */
        .room-menu-right {
            flex: 1;
            min-width: 280px;
            max-width: 350px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .ulasan-title { font-size: 22px; font-weight: bold; color: var(--primary); text-align: center; margin-bottom: 15px; }
        .ulasan-list { display: flex; flex-direction: column; gap: 10px; }
        .ulasan-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f8f9fa; border-radius: 12px; border-left: 4px solid var(--green); }
        .ulasan-avatar { width: 35px; height: 35px; background: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
        .ulasan-detail { flex: 1; font-size: 14px; }
        .ulasan-name { font-weight: bold; color: #333; }
        .ulasan-emoji { font-size: 24px; }

        /* Game area */
        .game-area { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
        .focus-box { background: white; border-radius: 30px; padding: 40px; width: 90%; max-width: 800px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); animation: slideIn 0.5s ease; position: relative; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .timer-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .timer-bar { flex: 1; height: 10px; background: #e0e0e0; border-radius: 10px; overflow: hidden; }
        .timer-progress { height: 100%; background: var(--green); transition: width 1s linear; }
        .timer-text { font-size: 28px; font-weight: bold; color: var(--accent); min-width: 50px; text-align: center; }
        .timer-text.warning { color: #FF0000; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .question-category { display: inline-block; padding: 8px 16px; background: var(--yellow); border-radius: 20px; font-weight: bold; margin-bottom: 15px; }
        .question-text { font-size: 28px; margin-bottom: 25px; color: #333; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .option-btn {
            padding: 20px;
            background: #f8f9fa;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        .option-btn:hover:not(:disabled) { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.02); }
        .option-btn.correct { background: var(--green); color: white; border-color: var(--green); animation: correctPulse 0.5s; }
        .option-btn.wrong { background: var(--accent); color: white; border-color: var(--accent); animation: wrongShake 0.5s; }
        @keyframes correctPulse { 50% { transform: scale(1.05); } }
        @keyframes wrongShake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .numeric-input-container { display: flex; gap: 15px; align-items: center; }
        .numeric-input { flex: 1; padding: 15px; font-size: 24px; border: 3px solid var(--primary); border-radius: 15px; text-align: center; outline: none; }
        .submit-numeric { padding: 15px 30px; background: var(--green); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }

        .countdown-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
        .countdown-number { font-size: 180px; font-weight: bold; color: white; animation: countdownAnim 1s ease; }
        @keyframes countdownAnim { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .countdown-text { font-size: 50px; color: var(--yellow); font-weight: bold; margin-top: 20px; }

        .end-screen { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; flex: 1; }
        .end-card { background: white; border-radius: 30px; padding: 40px; text-align: center; max-width: 600px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .end-title { font-size: 40px; margin-bottom: 20px; }
        .end-score { font-size: 60px; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .end-details { font-size: 20px; margin: 15px 0; }
        .end-status { font-size: 28px; font-weight: bold; margin: 20px 0; }
        .status-lulus { color: var(--green); }
        .status-belum { color: var(--accent); }
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-top: 25px; }
        .btn-secondary { padding: 12px 24px; background: #e0e0e0; color: #333; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-secondary:hover:not(:disabled) { background: #d0d0d0; transform: translateY(-2px); }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
        .feedback-container { margin-top: 20px; }
        .feedback-title { font-size: 18px; margin-bottom: 10px; }
        .emoticons { display: flex; gap: 15px; justify-content: center; }
        .emoticon-btn { font-size: 40px; cursor: pointer; background: none; border: none; transition: transform 0.2s; }
        .emoticon-btn:hover { transform: scale(1.3); }

        /* Responsive mobile */
        @media (max-width: 768px) {
            .login-card { padding: 25px; }
            .game-title { font-size: 30px; }
            .options-grid { grid-template-columns: 1fr; }
            .focus-box { padding: 20px; }
            .countdown-number { font-size: 100px; }
            .countdown-text { font-size: 30px; }
            .end-score { font-size: 40px; }

            .room-menu {
                flex-direction: column;
                gap: 15px;
            }
            .room-menu-left,
            .room-menu-right {
                width: 100%;
                max-width: 100%;
                position: static;
                min-width: auto;
            }
            .rooms-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .room-card { padding: 15px; }
            .room-icon { font-size: 40px; }
            .room-menu-right {
                max-height: 300px;
                overflow-y: auto;
                margin-top: 10px;
            }
        }
    </style>
</head>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBGvByjkM0gNyPH2DaaOgt9Z905BbDpZ7U",
            authDomain: "game-edukasi-anak-ffce4.firebaseapp.com",
            databaseURL: "https://game-edukasi-anak-ffce4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "game-edukasi-anak-ffce4",
            storageBucket: "game-edukasi-anak-ffce4.firebasestorage.app",
            messagingSenderId: "6376241471",
            appId: "1:6376241471:web:9dd40158a1e4164091fb8a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // State
        let currentPlayerName = '';
        let currentRoomId = 1;
        let highestUnlocked = 1;
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let timerInterval = null;
        let countdownInterval = null;
        let timeLeft = 30;
        let warningPlayed = false;
        let audioContext = null;
        let isGameActive = false;
        const roomOrder = [1, 2, 3, 4, 'A', 'B', 'C'];
        const roomConfig = {
            1: { total: 15, minCorrect: 12 },
            2: { total: 20, minCorrect: 17 },
            3: { total: 30, minCorrect: 27 },
            4: { total: 40, minCorrect: 37 },
            'A': { total: 25, minCorrect: 22, special: true },
            'B': { total: 30, minCorrect: 26, special: true },
            'C': { total: 35, minCorrect: 30, special: true }
        };

        // Audio
        function initAudio() { if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
        function playTone(freq, duration, type='sine', volume=0.3) {
            if (!audioContext) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + duration);
        }
        function playCorrectSound() { playTone(600,0.3,'sine',0.4); setTimeout(()=>playTone(800,0.3,'sine',0.4),100); }
        function playWrongSound() { playTone(200,0.3,'sawtooth',0.3); setTimeout(()=>playTone(150,0.4,'sawtooth',0.3),150); }
        function playCountdownBeep() { playTone(440,0.2,'sine',0.5); }
        function playWarningBeep() { playTone(880,0.15,'square',0.3); }
        function playGameEndSound() { playTone(523,0.3,'sine',0.5); setTimeout(()=>playTone(659,0.3,'sine',0.5),200); setTimeout(()=>playTone(784,0.3,'sine',0.5),400); setTimeout(()=>playTone(1047,0.5,'sine',0.5),600); }
        function announceGameEnd() { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance('Game sudah selesai!'); u.lang='id-ID'; speechSynthesis.speak(u); } }

        // Utility
        function sanitizeName(name) { return name.trim().replace(/\s+/g,'_').toLowerCase(); }
        function getPlayerRef(name) { return db.ref('gea_players/'+sanitizeName(name)); }
        async function loadPlayerProgress(name) { const snap = await getPlayerRef(name).once('value'); return snap.val() || null; }
        async function savePlayerProgress(name,data) { await getPlayerRef(name).update(data); }

        // Question generators
        function generateQuestions(total) {
            const qs = [];
            for (let i=0;i<total;i++) {
                const subjects=['numerik','logika','spasial','memori'];
                const subject=subjects[Math.floor(Math.random()*subjects.length)];
                switch(subject) {
                    case 'numerik': qs.push(generateMath()); break;
                    case 'logika': qs.push(generateLogic()); break;
                    case 'spasial': qs.push(generateSpatial()); break;
                    case 'memori': qs.push(generateMemory()); break;
                }
            }
            return qs;
        }
        
        function generateMath() {
            const a=Math.floor(Math.random()*20)+1, b=Math.floor(Math.random()*10)+1;
            const op=['+','-','×',':'][Math.floor(Math.random()*4)];
            let text, ans;
            switch(op){
                case '+': text=`${a} + ${b} = ?`; ans=a+b; break;
                case '-': text=`${Math.max(a,b)} - ${Math.min(a,b)} = ?`; ans=Math.abs(a-b); break;
                case '×': text=`${a} × ${b} = ?`; ans=a*b; break;
                case ':': const div=a*b; text=`${div} : ${a} = ?`; ans=b; break;
            }
            const opts=new Set([ans]); 
            while(opts.size<4) opts.add(ans+Math.floor(Math.random()*15)-7); // Rentang diperluas agar aman dari duplicate/infinite loop
            return { text, options:Array.from(opts).sort(()=>Math.random()-0.5), correct:ans, type:'multiple' };
        }
        
        function generateLogic() {
            let a=Math.floor(Math.random()*20)+1, b=Math.floor(Math.random()*20)+1;
            while(a === b) b=Math.floor(Math.random()*20)+1; // Pastikan a dan b tidak identik
            
            const larger=Math.max(a,b), smaller=Math.min(a,b);
            const opts=new Set([larger, smaller]);
            
            while(opts.size<4) opts.add(larger+Math.floor(Math.random()*10)+1);
            
            return { text:`Antara ${a} dan ${b}, mana yang lebih besar?`, options:Array.from(opts).map(String).sort(()=>Math.random()-0.5), correct:String(larger), type:'multiple' };
        }
        
        function generateSpatial() {
            const shapes=[{name:'segitiga',sides:3},{name:'persegi',sides:4},{name:'segi lima',sides:5},{name:'segi enam',sides:6},{name:'kubus',sides:6}];
            const chosen=shapes[Math.floor(Math.random()*shapes.length)];
            const correct=chosen.sides;
            const opts=new Set([correct]); 
            
            // Rentang diperluas untuk menghindari infinite loop
            while(opts.size<4) opts.add(Math.floor(Math.random() * 8) + 3);
            return { text:`Berapa sisi ${chosen.name}?`, options:Array.from(opts).map(String).sort(()=>Math.random()-0.5), correct:String(correct), type:'multiple' };
        }
        
        function generateMemory() {
            const items=['apel','bola','kucing','buku','mobil','roti'];
            const chosen=items[Math.floor(Math.random()*items.length)];
            const opts=new Set([chosen]); while(opts.size<4) opts.add(items[Math.floor(Math.random()*items.length)]);
            return { text:`Ingat! Sebutkan kembali: ${chosen}. Mana yang disebut?`, options:Array.from(opts).sort(()=>Math.random()-0.5), correct:chosen, type:'multiple' };
        }

        // UI functions
        function showLogin() { document.getElementById('loginScreen').style.display='block'; document.getElementById('mainContainer').style.display='none'; }
        function showMainContainer() {
            document.getElementById('loginScreen').style.display='none';
            document.getElementById('mainContainer').style.display='flex';
            document.getElementById('roomMenu').style.display='flex';
            document.getElementById('gameArea').style.display='none';
            document.getElementById('endScreen').style.display='none';
        }
        function showRoomMenu() {
            document.getElementById('roomMenu').style.display='flex';
            document.getElementById('gameArea').style.display='none';
            document.getElementById('endScreen').style.display='none';
            renderRooms();
        }

        function renderRooms() {
            const grid=document.getElementById('roomsGrid');
            grid.innerHTML='';
            roomOrder.forEach((roomId,index)=>{
                const config=roomConfig[roomId];
                const unlocked=roomOrder.indexOf(highestUnlocked) >= index;
                const card=document.createElement('div');
                card.className='room-card'+(unlocked?'':' locked');
                const icon=config.special?'🏆':['🦸','👥','🎪','🏟️'][index%4];
                card.innerHTML=`
                    <div class="room-lock-icon">${unlocked?'🔓':'🔒'}</div>
                    <div class="room-icon">${icon}</div>
                    <div class="room-name">Room ${roomId}</div>
                    <div class="room-info">${config.total} Soal<br>Minimal benar: ${config.minCorrect}</div>
                `;
                if (unlocked) card.addEventListener('click',()=>startRoom(roomId));
                grid.appendChild(card);
            });
        }

        function setupUlasanListener() {
            db.ref('gea_players').off();
            db.ref('gea_players').on('value',(snapshot)=>{
                const list=document.getElementById('ulasanList');
                list.innerHTML='';
                const players=snapshot.val()||{};
                const entries=[];
                Object.keys(players).forEach(name=>{
                    const data=players[name];
                    if(data.feedback_emoticon){
                        const emojiMap={'sangat_puas':'😄','puas':'🙂','netral':'😐','kurang_puas':'☹️'};
                        entries.push({name:data.name||name,emoji:emojiMap[data.feedback_emoticon]||'😊'});
                    }
                });
                entries.slice(-20).reverse().forEach(entry=>{
                    const item=document.createElement('div');
                    item.className='ulasan-item';
                    item.innerHTML=`
                        <div class="ulasan-avatar">${entry.name.charAt(0).toUpperCase()}</div>
                        <div class="ulasan-detail"><div class="ulasan-name">${entry.name}</div></div>
                        <div class="ulasan-emoji">${entry.emoji}</div>
                    `;
                    list.appendChild(item);
                });
                if(entries.length===0) list.innerHTML='<div style="text-align:center;color:#999;">Belum ada ulasan.</div>';
            });
        }

        function startRoom(roomId) {
            if (roomOrder.indexOf(roomId) > roomOrder.indexOf(highestUnlocked)) {
                alert('Room masih terkunci! Selesaikan room sebelumnya.');
                return;
            }
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

            currentRoomId = roomId;
            const total = roomConfig[roomId].total;
            questions = generateQuestions(total);
            currentQuestionIndex = 0;
            score = 0;
            correctCount = 0;
            wrongCount = 0;
            isGameActive = true;

            document.getElementById('roomMenu').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
            document.getElementById('endScreen').style.display = 'none';
            startCountdown();
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            const overlay = document.getElementById('countdownOverlay');
            const numberEl = document.getElementById('countdownNumber');
            const textEl = document.getElementById('countdownText');
            overlay.style.display = 'flex';
            let count = 5;
            numberEl.textContent = count;
            numberEl.style.color = 'white';
            textEl.textContent = 'Bersiap!';
            playCountdownBeep();
            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    numberEl.textContent = count;
                    numberEl.style.animation = 'none';
                    setTimeout(() => { numberEl.style.animation = 'countdownAnim 1s ease'; }, 10);
                    playCountdownBeep();
                } else if (count === 0) {
                    numberEl.textContent = 'GO!';
                    numberEl.style.color = '#1DD1A1';
                    textEl.textContent = 'GAME START!';
                    playCountdownBeep();
                } else {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    overlay.style.display = 'none';
                    numberEl.style.color = 'white';
                    showQuestion();
                }
            }, 1000);
        }

        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }
            const question = questions[currentQuestionIndex];
            const focusBox = document.getElementById('focusBox');
            let html = `
                <div class="timer-container">
                    <div class="timer-bar"><div class="timer-progress" id="timerProgress" style="width:100%"></div></div>
                    <div class="timer-text" id="timerText">30</div>
                </div>
                <div class="question-category">📚 Soal ${currentQuestionIndex+1} dari ${questions.length}</div>
                <div class="question-text">${question.text}</div>
            `;
            if (question.type === 'multiple') {
                html += `<div class="options-grid">`;
                question.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" data-index="${idx}" onclick="handleAnswer(${idx})">${String.fromCharCode(65+idx)}. ${opt}</button>`;
                });
                html += `</div>`;
            } else {
                html += `
                    <div class="numeric-input-container">
                        <input type="text" id="numericAnswer" class="numeric-input" placeholder="Ketik jawaban">
                        <button class="submit-numeric" onclick="handleNumericAnswer()">Jawab!</button>
                    </div>
                `;
            }
            focusBox.innerHTML = html;
            resetTimer();
        }

        function resetTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 30;
            warningPlayed = false;
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft === 9 && !warningPlayed) {
                    warningPlayed = true;
                    playWarningBeep();
                }
                if (timeLeft <= 9) playWarningBeep();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleAnswer(-1); // Timeout
                }
            }, 1000);
        }

        function updateTimerUI() {
            const timerText = document.getElementById('timerText');
            const progress = document.getElementById('timerProgress');
            if (timerText) {
                timerText.textContent = timeLeft;
                if (timeLeft <= 9) timerText.classList.add('warning');
                else timerText.classList.remove('warning');
            }
            if (progress) {
                progress.style.width = (timeLeft/30)*100 + '%';
                if (timeLeft <= 9) progress.style.background = '#FF0000';
                else progress.style.background = 'var(--green)';
            }
        }

        function handleAnswer(selectedIndex) {
            if (!isGameActive) return;
            clearInterval(timerInterval);
            timerInterval = null;
            const question = questions[currentQuestionIndex];
            const isCorrect = selectedIndex !== -1 && question.options[selectedIndex] === question.correct;
            
            // Nonaktifkan semua opsi saat diklik atau saat waktu habis agar mencegah klik berulang
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (question.type === 'multiple' && question.options[idx] === question.correct) btn.classList.add('correct');
                if (idx === selectedIndex && !isCorrect) btn.classList.add('wrong');
            });
            
            if (isCorrect) { correctCount++; score += 100; playCorrectSound(); }
            else { wrongCount++; playWrongSound(); }
            
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex >= questions.length) endGame();
                else showQuestion();
            }, 1500);
        }

        function handleNumericAnswer() {
            const input = document.getElementById('numericAnswer');
            if (!input) return;
            const answer = input.value.trim();
            if (!answer) return;
            const question = questions[currentQuestionIndex];
            const isCorrect = answer.toLowerCase() === question.correct.toString().toLowerCase();
            clearInterval(timerInterval);
            timerInterval = null;
            if (isCorrect) { correctCount++; score += 100; playCorrectSound(); }
            else { wrongCount++; playWrongSound(); }
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex >= questions.length) endGame();
                else showQuestion();
            }, 1500);
        }

        function endGame() {
            isGameActive = false;
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            playGameEndSound();
            announceGameEnd();
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('endScreen').style.display = 'flex';
            document.getElementById('endScore').textContent = score;
            document.getElementById('endDetails').textContent = `Benar: ${correctCount} | Salah: ${wrongCount}`;
            const minCorrect = roomConfig[currentRoomId].minCorrect;
            const passed = correctCount >= minCorrect;
            const statusEl = document.getElementById('endStatus');
            if (passed) { statusEl.textContent = 'LULUS! 🎉'; statusEl.className = 'end-status status-lulus'; }
            else { statusEl.textContent = 'BELUM TUNTAS 😢'; statusEl.className = 'end-status status-belum'; }
            const currentIndex = roomOrder.indexOf(currentRoomId);
            document.getElementById('btnNextRoom').disabled = !passed || currentIndex >= roomOrder.length - 1;
            saveProgress(passed);
        }

        async function saveProgress(passed) {
            try {
                const data = await loadPlayerProgress(currentPlayerName);
                const scores = data?.scores_per_room || {};
                scores[currentRoomId] = { score, correct: correctCount, total: questions.length, passed };
                let newHighest = highestUnlocked;
                const currentIndex = roomOrder.indexOf(currentRoomId);
                if (passed && currentIndex < roomOrder.length - 1) {
                    newHighest = roomOrder[currentIndex + 1];
                }
                await savePlayerProgress(currentPlayerName, { highest_room_unlocked: newHighest, scores_per_room: scores });
                highestUnlocked = newHighest;
                renderRooms();
            } catch (e) { console.error('Error saving progress:', e); }
        }

        function setupFeedback() {
            document.querySelectorAll('.emoticon-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const value = btn.dataset.value;
                    try {
                        await savePlayerProgress(currentPlayerName, { feedback_emoticon: value });
                        alert('Terima kasih atas feedbackmu! 😊');
                    } catch (e) { console.error('Error saving feedback:', e); }
                });
            });
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnLogin').addEventListener('click', async () => {
                const name = document.getElementById('playerNameInput').value.trim();
                if (!name) { alert('Masukkan nama kamu dulu ya! 😊'); return; }
                currentPlayerName = name;
                initAudio();
                try {
                    const progress = await loadPlayerProgress(name);
                    highestUnlocked = progress?.highest_room_unlocked || 1;
                } catch (e) { highestUnlocked = 1; }
                document.getElementById('headerAvatar').textContent = name.charAt(0).toUpperCase();
                document.getElementById('headerPlayerName').textContent = name;
                showMainContainer();
                renderRooms();
                setupUlasanListener();
            });
            document.getElementById('playerNameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('btnLogin').click();
            });
            document.getElementById('btnRetry').addEventListener('click', () => startRoom(currentRoomId));
            document.getElementById('btnNextRoom').addEventListener('click', () => {
                const currentIndex = roomOrder.indexOf(currentRoomId);
                if (currentIndex < roomOrder.length - 1) startRoom(roomOrder[currentIndex + 1]);
            });
            document.getElementById('btnBackToMenu').addEventListener('click', showRoomMenu);
            setupFeedback();
            showLogin();
        });

        // Expose functions for inline onclick
        window.handleAnswer = handleAnswer;
        window.handleNumericAnswer = handleNumericAnswer;
    </script>
</body>
</html>
